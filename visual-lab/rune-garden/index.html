<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="A bright, touch-friendly endless lane defense game with magical garden guardians, boss seeds, and combinable garden paths.">
  <meta name="author" content="Bryce A. Christopherson">
  <meta name="theme-color" content="#132c2a">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Rune Garden | Bryce Christopherson">
  <meta property="og:description" content="Choose garden friends, protect five paths, defeat bosses, and combine magical garden paths for as long as you can.">
  <title>Rune Garden | Bryce Christopherson</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <header class="topbar">
      <a class="home" href="../" aria-label="Back to Visual Lab" title="Back">&#x2190;</a>
      <div class="brand" aria-label="Rune Garden"><span class="brand-mark">&#x2736;</span><span>RUNE GARDEN</span></div>
      <div class="status" aria-label="Game status">
        <div class="counter nectar" id="nectarStatus" aria-label="250 nectar"><span aria-hidden="true">&#x2726;</span><b id="nectarCount">250</b></div>
        <div class="counter wave" id="waveStatus" aria-label="Wave 1"><span aria-hidden="true">&#x223F;</span><b id="waveCount">1</b></div>
        <div class="counter seed-counter" id="seedStatus" aria-label="0 garden path ranks chosen"><span aria-hidden="true">&#x25C8;</span><b id="seedCount">0</b></div>
      </div>
      <div class="top-actions">
        <button id="speedButton" class="speed-button" aria-label="Game speed 1 times. Activate for 2 times." title="Speed">1&#xD7;</button>
        <button id="soundButton" class="round-button" aria-label="Mute sound" aria-pressed="false" title="Sound">&#x266B;</button>
        <button id="helpButton" class="round-button" aria-label="How to play" title="How to play">?</button>
        <button id="pauseButton" class="round-button" aria-label="Pause game" aria-pressed="false" title="Pause">&#x2016;</button>
        <button id="fullscreenButton" class="round-button" aria-label="Enter fullscreen" aria-pressed="false" title="Fullscreen">&#x26F6;</button>
      </div>
    </header>

    <section id="gameShell" class="game-shell" aria-label="Rune Garden game">
      <canvas id="gameCanvas" role="application" tabindex="0" aria-label="Five-lane endless magical garden. Choose a garden friend below, then tap an empty tile to place it. Every fifth wave has a boss that unlocks a garden path. Arrow keys move across the garden; Enter places or selects a defender."></canvas>

      <div id="toast" class="toast" aria-live="polite"></div>

      <div id="tutorial" class="overlay tutorial" role="dialog" aria-modal="true" aria-label="How to play">
        <div class="tutorial-card">
          <div class="tutorial-scene" aria-hidden="true">
            <span class="demo-card">&#x1F33B;</span><span class="demo-arrow">&#x279C;</span><span class="demo-tile">&#x25A6;</span>
          </div>
          <div class="tutorial-dots"><i></i><i></i><i></i><i></i></div>
          <p id="tutorialText">Pick a garden friend. Tap a glowing tile.</p>
          <button id="tutorialNext" class="big-button" aria-label="Next tutorial step"><span aria-hidden="true">&#x279C;</span></button>
        </div>
      </div>

      <div id="specializationOverlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="specializationTitle">
        <div class="specialization-card">
          <div class="seed-award" aria-hidden="true">&#x25C8;</div>
          <h1 id="specializationTitle">CHOOSE A PATH</h1>
          <p class="specialization-hint"><span aria-hidden="true">&#x25C8;</span> <span id="specializationSeedCount">1</span></p>
          <div class="path-choices" id="pathChoices">
            <button class="path-choice sun" data-path="sun" aria-label="Choose Sun path">
              <span class="path-icon" aria-hidden="true">&#x2600;</span><span class="path-pips" aria-hidden="true"></span><small>SUN</small>
            </button>
            <button class="path-choice dew" data-path="dew" aria-label="Choose Dew path">
              <span class="path-icon" aria-hidden="true">&#x224B;</span><span class="path-pips" aria-hidden="true"></span><small>DEW</small>
            </button>
            <button class="path-choice thorn" data-path="thorn" aria-label="Choose Thorn path">
              <span class="path-icon" aria-hidden="true">&#x2767;</span><span class="path-pips" aria-hidden="true"></span><small>THORN</small>
            </button>
            <button class="path-choice storm" data-path="storm" aria-label="Choose Storm path">
              <span class="path-icon" aria-hidden="true">&#x03DF;</span><span class="path-pips" aria-hidden="true"></span><small>STORM</small>
            </button>
          </div>
          <p class="combo-hint" aria-label="Combine two paths to unlock more garden friends"><span aria-hidden="true">&#x2600; + &#x224B; = &#x2727;</span></p>
        </div>
      </div>

      <div id="endOverlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="endTitle" aria-live="assertive">
        <div class="end-card">
          <div id="endIcon" class="end-icon" aria-hidden="true">&#x2728;</div>
          <h1 id="endTitle">Wave 1</h1>
          <p id="endSummary">The garden reached wave 1.</p>
          <button id="restartButton" class="big-button" aria-label="Play again"><span aria-hidden="true">&#x21BB;</span><span>PLAY</span></button>
        </div>
      </div>

      <div id="pauseOverlay" class="overlay hidden" role="dialog" aria-modal="true" aria-label="Game paused">
        <button id="resumeButton" class="big-button" aria-label="Resume game"><span aria-hidden="true">&#x25B6;</span></button>
      </div>
    </section>

    <div class="tray" role="toolbar" aria-label="Garden friends">
      <div id="towerCards" class="tower-cards" aria-label="Unlocked garden friends"></div>
      <div class="tray-divider"></div>
      <button id="upgradeButton" class="upgrade-card" disabled aria-label="Upgrade selected garden friend, costs 75 nectar">
        <span aria-hidden="true">&#x2B06;</span><small>&#x2726;75</small>
      </button>
    </div>
  </main>
  <noscript>Rune Garden needs JavaScript enabled to play. <a href="../">Return to the Visual Lab.</a></noscript>
  <script src="game.js"></script>
</body>
</html>
